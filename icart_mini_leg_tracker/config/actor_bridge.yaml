# Gazebo Actor plugin の topic は Gazebo Transport 側で person_actor/* になる。
# ROS側の操作topicは /person/cmd_vel に統一し、bridgeでActor用のGazebo topicへ直接流す。

- ros_topic_name: "/person/cmd_vel"
  gz_topic_name: "/person_actor/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "ignition.msgs.Twist"
  direction: ROS_TO_GZ
  lazy: false

- ros_topic_name: "/person/actor_pose"
  gz_topic_name: "/person_actor/pose"
  ros_type_name: "geometry_msgs/msg/Pose"
  gz_type_name: "ignition.msgs.Pose"
  direction: GZ_TO_ROS
  lazy: false

- ros_topic_name: "/person/left_foot_pose"
  gz_topic_name: "/person_actor/left_foot_pose"
  ros_type_name: "geometry_msgs/msg/Pose"
  gz_type_name: "ignition.msgs.Pose"
  direction: GZ_TO_ROS
  lazy: false

- ros_topic_name: "/person/right_foot_pose"
  gz_topic_name: "/person_actor/right_foot_pose"
  ros_type_name: "geometry_msgs/msg/Pose"
  gz_type_name: "ignition.msgs.Pose"
  direction: GZ_TO_ROS
  lazy: false
